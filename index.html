<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Maid & Butler luxury household services">
<title>Maid & Butler | Luxury Household Services</title>
<style>
  :root {
    --pink:#d8457d;
    --deep:#111;
    --gold:#c7a45c;
    --cream:#fff8f5;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0;
    background:#f8eef1;
    font-family:Arial, Helvetica, sans-serif;
    color:#111;
  }
  .page {
    position:relative;
    width:min(100%,1024px);
    margin:0 auto;
    background:#fff;
    box-shadow:0 0 35px rgba(0,0,0,.18);
  }
  .design {
    display:block;
    width:100%;
    height:auto;
  }
  .hotspot {
    position:absolute;
    z-index:4;
    display:block;
    cursor:pointer;
    background:transparent;
    border:0;
    padding:0;
  }
  .hotspot:focus-visible {
    outline:3px solid #fff;
    box-shadow:0 0 0 6px var(--pink);
    border-radius:4px;
  }
  .mobile-bar {
    display:none;
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:30;
    grid-template-columns:1fr 1fr;
    background:#111;
    box-shadow:0 -6px 18px rgba(0,0,0,.22);
  }
  .mobile-bar a, .mobile-bar button {
    border:0;
    padding:14px 8px;
    color:#fff;
    text-decoration:none;
    font-weight:700;
    text-align:center;
    font-size:14px;
  }
  .mobile-bar button { background:var(--pink); }
  .mobile-bar a { background:#111; }

  .modal {
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    place-items:center;
    padding:20px;
    background:rgba(0,0,0,.72);
  }
  .modal.open { display:grid; }
  .modal-card {
    width:min(560px,100%);
    max-height:90vh;
    overflow:auto;
    background:linear-gradient(180deg,#fffaf8,#fbe8ef);
    border:2px solid var(--gold);
    box-shadow:0 30px 90px rgba(0,0,0,.35);
    padding:30px;
    position:relative;
  }
  .modal-card:before {
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(216,69,125,.35);
    pointer-events:none;
  }
  .close {
    position:absolute;
    right:12px; top:10px;
    width:38px; height:38px;
    border:0;
    background:#111;
    color:#fff;
    font-size:24px;
    cursor:pointer;
    z-index:2;
  }
  .modal h2 {
    margin:0 0 6px;
    font-family:Georgia,serif;
    font-size:38px;
    text-align:center;
  }
  .modal .sub {
    margin:0 0 24px;
    color:#b62c61;
    text-align:center;
    font-weight:700;
  }
  .field-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  label {
    display:grid;
    gap:6px;
    margin-bottom:14px;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  input, select, textarea {
    width:100%;
    padding:13px 12px;
    border:1px solid #cdb8c0;
    background:#fff;
    font:inherit;
  }
  textarea { min-height:110px; resize:vertical; }
  .submit {
    width:100%;
    border:1px solid var(--gold);
    background:#111;
    color:#fff;
    padding:15px;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:700;
    cursor:pointer;
  }
  .success {
    display:none;
    margin:14px 0 0;
    padding:12px;
    background:#fff;
    border-left:4px solid var(--pink);
    font-weight:700;
  }
  .success.show { display:block; }

  @media (max-width:700px) {
    body { padding-bottom:54px; }
    .page { width:100%; box-shadow:none; }
    .mobile-bar { display:grid; }
    .field-grid { grid-template-columns:1fr; gap:0; }
    .modal-card { padding:26px 20px; }
  }
</style>
</head>

<div class="modal" id="bookingModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="bookingTitle">
    <button class="close" aria-label="Close">×</button>
    <h2 id="bookingTitle">Private Booking Request</h2>
    <p class="sub">Maid & Butler Luxury Household Services</p>

    <form id="bookingForm">
      <div class="field-grid">
        <label>Full name
          <input name="name" type="text" required>
        </label>
        <label>Telephone
          <input name="phone" type="tel" required>
        </label>
      </div>

      <div class="field-grid">
        <label>Email
          <input name="email" type="email" required>
        </label>
        <label>Preferred date
          <input name="date" type="date" required>
        </label>
      </div>

      <label>Service
        <select name="service" required>
          <option value="">Choose a service</option>
          <option>House Cleaning</option>
          <option>Cooking</option>
          <option>Nanny</option>
          <option>Pet Sitting</option>
          <option>Driver</option>
          <option>Gardening</option>
          <option>Snow Shovelling</option>
          <option>Window Cleaning</option>
          <option>Laundry & Ironing</option>
          <option>Home Care Package</option>
          <option>Family Care Package</option>
          <option>Premium Butler Service</option>
        </select>
      </label>

      <label>Message
        <textarea name="message" placeholder="Location, number of hours and any special requirements"></textarea>
      </label>

      <button class="submit" type="submit">Send booking request</button>
      <div class="success" id="success">Thank you. Your request is ready to be connected to email, WhatsApp, Lovable or Supabase.</div>
    </form>
  </div>
</div>

<script>
  const modal = document.getElementById('bookingModal');
  const openers = document.querySelectorAll('.open-booking');
  const closeButton = modal.querySelector('.close');
  const form = document.getElementById('bookingForm');
  const success = document.getElementById('success');
  const date = form.querySelector('input[type="date"]');
  date.min = new Date().toISOString().split('T')[0];

  function openModal() {
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    setTimeout(() => form.querySelector('input').focus(), 50);
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
  }

  openers.forEach(el => el.addEventListener('click', openModal));
  closeButton.addEventListener('click', closeModal);
  modal.addEventListener('click', e => {
    if (e.target === modal) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    success.classList.add('show');
  });
</script>
